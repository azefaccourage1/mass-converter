
<!DOCTYPE html>
<html>
<head>
    <title>Mass Converter</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: lightblue;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 25px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
        }

        input, select, button {
            padding: 10px;
            margin: 10px;
            width: 90%;
        }

        button {
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Mass Converter</h2>

        <input type="number" id="mass" placeholder="Enter mass">

        <br>

        <select id="from">
            <option value="1">Gram</option>
            <option value="1000">Kilogram</option>
            <option value="0.001">Milligram</option>
            <option value="1000000">Tonne</option>
            <option value="453.592">Pound</option>
            <option value="28.35">Ounce</option>
        </select>

        <br>

        <select id="to">
            <option value="1">Gram</option>
            <option value="1000">Kilogram</option>
            <option value="0.001">Milligram</option>
            <option value="1000000">Tonne</option>
            <option value="453.592">Pound</option>
            <option value="28.35">Ounce</option>
        </select>

        <br>

        <button onclick="convert()">Convert</button>

        <h3 id="result">Result: 0</h3>

    </div>

    <script>

        function convert() {

            let mass = document.getElementById("mass").value;
            let from = document.getElementById("from").value;
            let to = document.getElementById("to").value;

            if (mass === "" || mass < 0) {
                document.getElementById("result").innerHTML =
                    "Enter a valid mass";
                return;
            }

            let answer = (mass * from) / to;

            document.getElementById("result").innerHTML =
                "Result: " + answer.toFixed(2);
        }

    </script>

</body>
</html>
